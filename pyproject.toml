[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-telemetry-lab"
dynamic = ["version"]
description = "Raw-first F1 23/24/25 UDP telemetry collector"
requires-python = ">=3.10"

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]
gui = ["PySide6==6.11.2", "pyqtgraph==0.14.0", "numpy==2.5.3"]

[project.scripts]
racetrace-lab = "collector.qt_ui.app:main"
f1-telemetry-lab = "collector.qt_ui.app:main"
f1-telemetry-qt = "collector.qt_ui.app:main"
f1-telemetry-tk = "collector.gui:main"
f1-telemetry-collector = "collector.main:main"
f1-telemetry-inspect = "collector.inspect_session:main"
f1-telemetry-ui = "collector.qt_ui.app:main"
f1-telemetry-decode = "collector.decode_session:main"
f1-telemetry-analyze = "collector.analyze_session:main"
f1-telemetry-analysis-ui = "collector.analysis_gui:main"
f1-telemetry-compress = "collector.compress_archive:main"
f1-telemetry-prepare = "collector.prepare_session:main"
f1-telemetry-audit = "collector.audit_session:main"

[tool.setuptools.packages.find]
include = ["collector*", "decoder*", "storage*", "analysis*"]

[tool.setuptools.dynamic]
version = {attr = "collector.__version__"}

[tool.unittest]
start-directory = "tests"

